<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSE Results</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" href="/static/styles/index.css">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
</head>

<body>
    <div id="students-page">
        <style>
            #student-percentage-section {
                width: 100%;
            }

            ::-webkit-scrollbar {
                width: 8px;
                height: 8px;
            }

            ::-webkit-scrollbar-track {
                background: #252525;
                border-radius: 10px;
            }

            ::-webkit-scrollbar-thumb {
                background: linear-gradient(180deg, #444, #666);
                border-radius: 10px;
                border: 2px solid #252525;
            }

            ::-webkit-scrollbar-thumb:hover {
                background: linear-gradient(180deg, #555, #777);
            }

            /* Firefox */
            * {
                scrollbar-width: thin;
                scrollbar-color: #444 #252525;
            }

            .chart-container {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;

                padding: 20px 0;
                background-color: #2e2e2e;
                border-radius: 10px;
                margin: 20px 0;
            }

            .chart-section {
                width: 100%;
                height: 520px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }

            @media (max-width: 1200px) {
                .chart-section {
                    overflow-x: scroll;
                    overflow-y: auto;
                    align-items: start;
                    justify-content: start;
                }
            }

            #fullscreen-modal {
                position: fixed;
                top: 0;
                left: 0;
                z-index: 9999;
                width: 100vw;
                height: 100vh;
                background: rgba(0, 0, 0, 0.9);
                /* display: none; */
                align-items: center;
                justify-content: center;
            }

            #close-btn {
                position: absolute;
                top: 15px;
                right: 20px;
                color: white;
                font-size: 30px;
                cursor: pointer;
            }

            #chart_div {
                height: 500px;
                border-radius: 10px;
                width: 1200px;
            }

            #chart_div_science {
                height: 500px;
                border-radius: 10px;
                width: 1200px;
            }

            #students-page {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 20px;
                width: 95%;
                /* max-width: 800px; */
                padding: 20px;
                background: #252525;
                border-radius: 10px;
                box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
                position: relative;
            }

            .student-page-top-section {
                text-align: center;
                display: flex;
                flex-direction: column;
                gap: 10px;
                padding: 15px;
                border-bottom: 2px solid #444;
            }

            .student-name {
                font-weight: 700;
                font-size: 26px;
                color: rgb(255, 204, 0, .6);
            }

            .student-rollno,
            .student-group {
                font-weight: 600;
                font-size: 18px;

                color: #ffcc00;
            }

            .student-rollno {
                color: #b6b6b6;
            }

            .student-school {
                font-weight: 500;
                font-size: 18px;
                background-color: #333;
                color: #cccccc;
                padding: 8px 15px;
                border-radius: 6px;
                text-align: center;
                width: fit-content;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
            }

            .student-school:hover {
                background-color: #2e2e2e;
                color: #ffcc0083;
                cursor: pointer;
            }

            .student-mark-section {
                width: 100%;
                max-width: 800px;
                padding: 15px 0;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                background-color: #333;
                color: #ffffff;
                border-radius: 8px;
                overflow: hidden;
                text-align: left;
            }

            thead {
                background-color: #444;
            }

            th,
            td {
                padding: 12px;
                border-bottom: 1px solid #555;
            }

            th {
                font-weight: bold;
                text-transform: uppercase;
                letter-spacing: 1px;
                color: #ffcc00;
            }

            tr:hover {
                background-color: #2e2e2e;
            }

            tbody tr:last-child td {
                border-bottom: none;
            }

            @media (max-width: 800px) {
                #students-page {
                    width: 95%;
                    padding: 15px;
                }

                #chart_div {
                    height: 300px;
                }

                .student-name {
                    font-size: 22px;
                }

                .student-rollno,
                .student-group {
                    font-size: 16px;
                }

                .student-school {
                    font-size: 18px;
                    padding: 6px 12px;
                }

                table {
                    font-size: 14px;
                }

                th,
                td {
                    padding: 8px;
                }
            }

            @keyframes shimmer {
                0% {
                    background-position: -200% 0;
                }

                100% {
                    background-position: 200% 0;
                }
            }

            #student-page-back-to-search {
                position: absolute;
                padding: 10px;
                background-color: #3d3d3d;
                border-radius: 5px;
                background: linear-gradient(90deg,
                        rgba(255, 255, 255, 0.1) 25%,
                        rgba(255, 255, 255, 0.3) 50%,
                        rgba(255, 255, 255, 0.1) 75%);
                background-size: 200% 100%;
                animation: shimmer 2.5s infinite linear;
                left: 15px;
                top: 15px;
                cursor: pointer;
                font-weight: bold;
                color: #b1a886;
            }

            #student-page-back-to-search:hover {
                background-color: rgb(7, 95, 7, .4);
            }

            .modal {
                position: absolute;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: rgba(0, 0, 0, 0.8);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 9999;
            }

            .modal.hidden {
                display: none !important;
            }

            .modal-content {
                background: #252525;
                padding: 2rem;
                border-radius: 1rem;
                width: 90%;
                max-height: 90vh;
                overflow-y: auto;
            }

            #modal-body {
                /* height: 100%; */
                /* overflow-y: auto; */
                /* width: 100%; */
            }

            /* #fullscreen_chart {
                width: 100%;
                min-height: 70vh;
                height: 100%;
            } */

            /* @media screen and (max-width: 768px) {

                body.modal-open {
                    overflow: scroll;
                }
            } */

            /* body.modal-open {
                overflow: hidden;
            } */
        </style>

        <div id="student-page-back-to-search" hx-get="/static/09052024P2/search.html" hx-swap="outerHTML"
            hx-target="#students-page" hx-select="#search-page"> 🔙 Search
        </div>

        <div class="student-page-top-section">
            <div class="student-name">{{ .Name }}</div>
            <div class="student-rollno">{{ .RollNo }}</div>
            <div class="student-school" hx-get="/09052024P2/search/school/{{ .SchoolCode }}" hx-swap="outerHTML"
                hx-target="body" hx-select="#school-page" hx-push-url="/09052024P2/search/school/{{ .SchoolCode }}">{{
                .SchoolName }} - {{ .SchoolCode }}</div>
        </div>
        <div class="student-group">{{ .StudentGroup }}</div>

        <div class="student-mark-section">
            <table>
                <thead>
                    <tr>
                        <th>Subject</th>
                        <th>Mark</th>
                        <th>Grade</th>
                    </tr>
                </thead>
                <tbody>
                    {{ .Subjects }}
                </tbody>
            </table>
        </div>
        <div id="student-percentage-section">
            <div class="chart-container">
                <div class="chart-name">Overall Rank details</div>
                <div class="chart-section">
                    <div id="chart_div" class="chart-only"></div>
                </div>
            </div>
            <div class="chart-container">
                <div class="chart-name">Mark vs Count (Group wise)</div>
                <div class="chart-section">
                    <div id="chart_div_science" class="chart-only"></div>
                </div>
            </div>
        </div>
        <script>
            function loadScript(src, callback) {
                // Check if script is already in the document
                if (document.querySelector(`script[src="${src}"]`)) {
                    console.log(`Script ${src} already loaded.`);
                    if (callback) callback(); // still call the callback to continue flow
                    return;
                }

                const script = document.createElement('script');
                script.src = src;
                script.onload = callback;
                script.onerror = function () {
                    console.error(`Failed to load script: ${src}`);
                };
                document.head.appendChild(script);
            }

            // Step 1: Load Google Charts loader.js first
            loadScript('https://www.gstatic.com/charts/loader.js', async function () {
                console.log('Google Charts loader.js loaded');

                // Step 2: Load your custom chart.js after loader.js
                loadScript('/static/chart.js', async function () {
                    // loadScript('/static/indexDb.js', async function () {
                    //     console.log('indexDb.js loaded');
                    // });
                    console.log('Your chart.js loaded');

                    // Step 3: Now it's safe to call loadGoogleCharts and define modal functions
                    await loadGoogleCharts('{{ .TotalMarks }}', 'overall');
                    await loadGoogleCharts('{{ .TotalMarks }}', 'science');

                    window.openModalWithContent = async function (totalMarks, title, group) {
                        const modal = document.getElementById('fullscreen-modal');
                        // const modalBody = document.getElementById('fullscreen_chart');
                        const modalTitle = document.getElementById('modal-title');

                        modalTitle.innerHTML = title;
                        // modalBody.innerHTML = `<div id="fullscreen_chart" style="width: 2400px; height: 600px; display: inline-block;"></div>`;
                        await loadGoogleCharts(totalMarks, group, true);

                        document.body.classList.add('modal-open');
                        modal.classList.remove('hidden');
                    };

                    window.closeModal = function () {
                        document.getElementById('fullscreen-modal').classList.add('hidden');
                        document.body.classList.remove('modal-open');
                    };
                });
            });

            loadScript("/static/adjustZoom.js", function () {
                window.onload = () => adjustZoom(true);
                window.onresize = () => adjustZoom(true);
                adjustZoom(true);
            });
        </script>

        <div id="fullscreen-modal" class="modal hidden">
            <div class="modal-content">
                <button onclick="closeModal()">Close</button>
                <div id="modal-title"></div>
                <div id="fullscreen_chart" style="width: 2400px; height: 600px; display: inline-block;"></div>
            </div>
        </div>
    </div>
</body>


</html>
