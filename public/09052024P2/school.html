<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Results</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: #2e2e2e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(255, 255, 255, 0.1);
        }

        h1,
        h2 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #444;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #3e3e3e;
        }

        .pass {
            color: #4caf50;
        }

        .fail {
            color: #ff5252;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>School Exam Results</h1>
        <h2>School Name: <span id="schoolName"></span> (Code: <span id="schoolCode"></span>)</h2>
        <table>
            <thead>
                <tr>
                    <th>Roll No</th>
                    <th>Name</th>
                    <th>Group</th>
                    <th>Subjects & Marks</th>
                    <th>Result</th>
                </tr>
            </thead>
            <tbody id="resultTableBody"></tbody>
        </table>
    </div>

    <script>
        const schoolData = {
            name: "XYZ Public School",
            schoolCode: 1234,
            result: [
                {
                    rollNo: "001",
                    regular: true,
                    name: "John Doe",
                    group: "Science",
                    subject1: { name: "Math", grade: "A", marks: 95 },
                    subject2: { name: "Physics", grade: "B", marks: 85 },
                    subject3: { name: "Chemistry", grade: "A", marks: 90 },
                    subject4: { name: "Biology", grade: "A", marks: 88 },
                    subject5: { name: "English", grade: "B", marks: 80 },
                    subject6: { name: "Computer", grade: "A", marks: 92 },
                    result: "Pass"
                },
                {
                    rollNo: "002",
                    regular: true,
                    name: "Jane Smith",
                    group: "Commerce",
                    subject1: { name: "Accounts", grade: "C", marks: 65 },
                    subject2: { name: "Economics", grade: "B", marks: 75 },
                    subject3: { name: "Business Studies", grade: "A", marks: 88 },
                    subject4: { name: "Math", grade: "C", marks: 60 },
                    subject5: { name: "English", grade: "B", marks: 70 },
                    subject6: { name: "Statistics", grade: "B", marks: 78 },
                    result: "Pass"
                }
            ]
        };

        document.getElementById("schoolName").innerText = schoolData.name;
        document.getElementById("schoolCode").innerText = schoolData.schoolCode;

        const tableBody = document.getElementById("resultTableBody");
        schoolData.result.forEach(student => {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${student.rollNo}</td>
                <td>${student.name}</td>
                <td>${student.group}</td>
                <td>
                    ${student.subject1.name}: ${student.subject1.marks} (${student.subject1.grade})<br>
                    ${student.subject2.name}: ${student.subject2.marks} (${student.subject2.grade})<br>
                    ${student.subject3.name}: ${student.subject3.marks} (${student.subject3.grade})<br>
                    ${student.subject4.name}: ${student.subject4.marks} (${student.subject4.grade})<br>
                    ${student.subject5.name}: ${student.subject5.marks} (${student.subject5.grade})<br>
                    ${student.subject6.name}: ${student.subject6.marks} (${student.subject6.grade})
                </td>
                <td class="${student.result === 'Pass' ? 'pass' : 'fail'}">${student.result}</td>
            `;
            tableBody.appendChild(row);
        });
    </script>
</body>

</html>
