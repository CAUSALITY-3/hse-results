<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Results</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" type="text/css" href="/static/styles/search.css">

</head>

<body>
    <div id="school-page" class="container">
        <div id="school-page-back-to-search" hx-get="/static/09052024P2/schoolSearch.html" hx-swap="outerHTML"
            hx-target="#school-page" hx-select="#school-search-page"> 🔙 Search
        </div>
        <style>
            #school-page-back-to-search {
                position: absolute;
                padding: 10px;
                background-color: #3d3d3d;
                border-radius: 5px;
                background: linear-gradient(90deg,
                        rgba(255, 255, 255, 0.1) 25%,
                        rgba(255, 255, 255, 0.171) 50%,
                        rgba(255, 255, 255, 0.1) 75%);
                background-size: 200% 100%;
                animation: shimmer 2.5s infinite linear;
                left: 15px;
                top: 15px;
                cursor: pointer;
                font-weight: bold;
                color: #b1a886;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;

                /* display: flex;
                justify-content: center;
    
                align-items: center; */
            }


            /* WebKit Browsers (Chrome, Edge, Safari) */
            ::-webkit-scrollbar {
                width: 8px;
                height: 8px;
            }

            ::-webkit-scrollbar-track {
                background: #252525;
                border-radius: 10px;
            }

            ::-webkit-scrollbar-thumb {
                background: linear-gradient(180deg, #444, #666);
                border-radius: 10px;
                border: 2px solid #252525;
            }

            ::-webkit-scrollbar-thumb:hover {
                background: linear-gradient(180deg, #555, #777);
            }

            /* Firefox */
            * {
                scrollbar-width: thin;
                scrollbar-color: #444 #252525;
            }


            html {
                display: flex;
                justify-content: center;

                align-items: center;
            }

            body {
                display: flex;
                justify-content: center;

                align-items: center;
                /* height: 100vh; */
                width: fit-content;
                /* width: auto; */
                background-color: #1e1e1e;
                color: #ffffff;
                font-family: Arial, sans-serif;
                transform-origin: top left;
                height: auto;
            }

            .container {
                /* width: 1200px;
                max-width: 1200px; */
                /* width: 1400px; */
                padding: 20px;
                background: #252525;
                border-radius: 10px;
                box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.5);
            }

            h1,
            h2 {
                text-align: center;
                margin-bottom: 15px;
            }

            .result-section {
                max-height: 85vh;
                overflow-y: auto;
                border-radius: 5px;
                border: 1px solid #444;
            }

            @media (max-width: 600px) {
                .result-section {
                    overflow-y: scroll;
                    border-radius: 5px;
                    border: 1px solid #444;
                    max-height: 300vh;
                }


            }

            table {
                width: 100%;
                border-collapse: collapse;
                table-layout: fixed;
                background: #333;
            }

            thead {
                position: sticky;
                top: 0;
                background: #3e3e3e;
                z-index: 100;
            }

            th,
            td {
                padding: 12px;
                text-align: center;
                border: 1px solid #444;
            }

            th {
                background: #3e3e3e;
                font-weight: bold;
            }

            .pass {
                color: #4caf50;
                font-weight: bold;
            }

            .fail {
                color: #ff5252;
                font-weight: bold;
            }

            .marks {
                color: #ffd700;
                font-weight: bold;
            }

            .grade {
                color: #00bcd4;
                font-weight: bold;
            }
        </style>
        <h1>School Exam Results</h1>
        <h2>School Name: {{ .Name }} (Code: {{ .SchoolCode }})
        </h2>
        <div class="result-section" id="resultSection">
            <table>
                <thead>
                    <tr>
                        <th>Roll No</th>
                        <th>Name</th>
                        <th>Group</th>
                        <th>Subject-1</th>
                        <th>Subject-2</th>
                        <th>Subject-3</th>
                        <th>Subject-4</th>
                        <th>Subject-5</th>
                        <th>Subject-6</th>
                        <th>Result</th>
                    </tr>
                </thead>
                <tbody id="resultTableBody"></tbody>
            </table>
        </div>
        <script>

            function loadScript(src, callback) {
                // Check if script is already in the document
                if (document.querySelector(`script[src="${src}"]`)) {
                    console.log(`Script ${src} already loaded.`);
                    if (callback) callback(); // still call the callback to continue flow
                    return;
                }

                const script = document.createElement('script');
                script.src = src;
                script.onload = callback;
                script.onerror = function () {
                    console.error(`Failed to load script: ${src}`);
                };
                document.head.appendChild(script);
            }

            loadScript("/static/adjustZoom.js", zoomFn);

            function zoomFn() {
                const schoolResult = JSON.parse('{{ .SchoolResult }}');
                window.onload = () => adjustZoom(false);
                window.onresize = () => adjustZoom(false);
                adjustZoom(false);
                const tableBody = document.getElementById("resultTableBody");
                schoolResult.forEach(student => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                    <td>${student.rollNo}</td>
                    <td>${student.name}</td>
                    <td>${student.group}</td>
                    ${student.subjects.map((subject, index) => {
                        return `<td>${subject.name ? `${subject.name}: <span class='marks'>${!subject.marks ? "" : subject.marks}</span> (<span class='grade'>${subject.grade}</span>)` : ''}</td>`;
                    }).join('')}
                    <td class="${student.result === 'EHS' ? 'pass' : 'fail'}">${student.result}</td>
                `;
                    tableBody.appendChild(row);
                });
            };
        </script>
        <div class="school-rank-container">
            <div class="school-chart-name">School Rank details</div>
            <div class="school-rank-details">
                <div class="school-rank-details-item">Rank: <span id="school-school-rank"
                        class="school-rank-value"></span></div>
                <div class="school-rank-details-item">Total schools: <span id="school-total-school-count"
                        class="school-rank-value"></span></div>
                <div class="school-rank-details-item">Total schools Ahead of you: <span
                        id="school-total-school-ahead-count" class="school-rank-value"></span></div>
                <div class="school-rank-details-item">Total schools Behind you: <span
                        id="school-total-school-behind-count" class="school-rank-value"></span></div>
                <div class="school-rank-details-item">Total schools same as you: <span
                        id="school-total-school-same-count" class="school-rank-value"></span></div>
            </div>
            <div class="school-chart-section">
                <div id="chart_div_school" class="chart-only"></div>
            </div>

        </div>


</body>

</html>
