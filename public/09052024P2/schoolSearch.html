<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSE Results</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" type="text/css" href="/static/styles/search.css">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
</head>

<body>
    <div id="school-search-page">
        <style>
            #school-search-page {
                width: 720px;
                height: 100vh;
                /* padding: 50px 0; */
            }

            #school-search-page p {
                text-align: center;
                color: #c0c0c0;
            }

            @media screen and (max-width: 800px) {
                #school-search-page {
                    width: 90vw;
                }
            }

            .school-search-input-container {
                background-color: #2b2b2b;
                padding: 20px;
                border-radius: 10px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            }

            .school-search-input-container label {
                display: block;
                margin-bottom: 8px;
                color: #c0c0c0;
            }

            .school-search-input-container input[type="text"] {
                width: 100%;
                padding: 10px 30px 10px 10px;
                border: 1px solid #444;
                border-radius: 5px;
                box-sizing: border-box;
                font-size: 16px;
                background-color: #3b3b3b;
                color: #f0f0f0;
            }

            .school-search-input-div-container {
                position: relative;
                display: inline-block;
                width: 100%;
                height: 100%;
            }

            .spinner {
                position: absolute;
                right: 10px;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
                height: 20px;
                display: none;
                filter: invert(34%) sepia(97%) saturate(65%) hue-rotate(178deg) brightness(89%) contrast(85%);
            }

            /* #school-search-go {
                position: absolute;
                right: 10px;
                top: 50%;
                transform: translateY(-50%);
                width: 25px;
                height: 25px;
                padding: 5px;
                border-radius: 3px;
                display: none; */
            /* filter: invert(34%) sepia(97%) saturate(65%) hue-rotate(178deg) brightness(89%) contrast(85%); */
            /* } */

            /* #school-search-go:hover {
                background-color: #4e4e4e;
            } */

            #school-search-response {
                margin: 7px 0 0 0;
                max-height: 80vh;
                overflow-y: scroll;
                scrollbar-width: none;
                /* Firefox */
                -ms-overflow-style: none;
                /* IE/Edge */

                /* Hide scrollbar for Webkit browsers */
                &::-webkit-scrollbar {
                    display: none;
                }
            }

            .school-query-no-result {
                margin-top: 10px;
                padding: 5px;
                font-size: 16px;
                color: #c7c7c7;
                font-weight: 700;
                text-shadow: 2px 2px 3px rgba(255, 255, 255, 0.1);
                animation: fadeIn 0.3s ease-in-out forwards;
            }

            .school-query-result {

                border: 1px solid #444;
                border-radius: 5px;
                padding: 10px;
                margin: 5px 0;
                background-color: #3d3d3d;
                cursor: pointer;
                overflow: hidden;
                text-overflow: ellipsis;
                line-height: 16px;
                font-size: 12px;
                /* opacity: 0;
                transform: translateY(10px);
                animation: fadeIn 0.3s ease-in-out forwards; */
            }

            .school-query-result:hover {
                background-color: #696969;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .hide {
                opacity: 0;
                transition: opacity 0.1s ease-in-out;
            }

            #individual-school-route-container {
                display: flex;
                width: 100%;
                align-items: center;
                position: relative;
                height: 100px;
            }

            #school-search-route {
                position: absolute;
                padding: 15px;
                background-color: #3d3d3d;
                border-radius: 5px;
                background: linear-gradient(90deg,
                        rgba(255, 255, 255, 0.1) 25%,
                        rgba(255, 255, 255, 0.3) 50%,
                        rgba(255, 255, 255, 0.1) 75%);
                background-size: 200% 100%;
                animation: shimmer 1.5s infinite linear;
                right: 10px;
                cursor: pointer;
            }

            @keyframes shimmer {
                0% {
                    background-position: -200% 0;
                }

                100% {
                    background-position: 200% 0;
                }
            }

            #school-search-route:hover {
                background-color: rgb(7, 95, 7, .4);
            }

            #individual-route-title {
                font-weight: 700;
                font-size: larger;
            }
        </style>

        <div id="individual-school-route-container">
            <div id="individual-route-title">School Search</div>
            <div id="school-search-route" hx-get="/static/09052024P2/search.html" hx-swap="outerHTML"
                hx-target="#school-search-page" hx-select="#search-page" hx-push-url="?searchType=student">Student Wise
                🡺</div>
        </div>
        <div class="school-search-input-container">
            <form id="school-search-myForm">
                <label for="schoolNameOrCode">School Name or Code</label>
                <div class="school-search-input-div-container">
                    <input type="text" id="schoolNameOrCode" name="schoolNameOrCode"
                        placeholder="Enter your school name or code ...">
                    <img id="spinner" class="spinner" src="https://htmx.org/img/bars.svg" />
                    <!-- <img id="school-search-go" hx-get="/hello" hx-trigger="click, keyup[keyCode==13]"
                        hx-swap="outerHTML" hx-select="#index-page" hx-target="#school-search-page"
                        hx-vals='js:{ schoolNameOrCode: document.getElementById("schoolNameOrCode").value }'
                        src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c0c0c0' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 12h12M12 6l6 6-6 6'/></svg>"
                        alt="Right Arrow"> -->


                </div>
            </form>
            <div id="school-search-response">

            </div>
        </div>

        <script>
            try {
                const schoolInputField = document.getElementById('schoolNameOrCode');

                let schoolInputValStart;
                let schoolCodeName;

                function loadScript(src, callback) {
                    // Check if script is already in the document
                    if (document.querySelector(`script[src="${src}"]`)) {
                        console.log(`Script ${src} already loaded.`);
                        if (callback) callback(); // still call the callback to continue flow
                        return;
                    }

                    const script = document.createElement('script');
                    script.src = src;
                    script.onload = callback;
                    script.onerror = function () {
                        console.error(`Failed to load script: ${src}`);
                    };
                    document.head.appendChild(script);
                }
                loadScript("/static/adjustZoom.js", function () {
                    window.onload = () => adjustZoom(true);
                    window.onresize = () => adjustZoom(true);
                    adjustZoom(true);
                });
                async function fetchData() {
                    try {
                        const schoolCodeNameMapping = localStorage.getItem("09052024P2_schoolCodeNameMapping");
                        if (schoolCodeNameMapping) {
                            schoolCodeName = JSON.parse(schoolCodeNameMapping);
                        } else {
                            const schoolNamesApi = await fetch(`/static/09052024P2/schoolCodeName.json`);
                            schoolCodeName = await schoolNamesApi.json()
                            localStorage.setItem("09052024P2_schoolCodeNameMapping", JSON.stringify(schoolCodeName))
                        }
                    } catch (error) {
                        console.error("Error fetching data:", error);
                    }
                }

                function findPatternMatchingSchoolName(pattern, schools) {
                    const filteredSchools = []
                    for (const code in schools) {
                        if (schools[code]?.toUpperCase()?.includes(pattern)) {
                            filteredSchools.push({
                                name: schools[code],
                                code
                            })
                        }
                    }
                    return filteredSchools;
                }
                function delay(ms) {
                    return new Promise(resolve => setTimeout(resolve, ms));
                }

                function removeSchools() {
                    const container = document.getElementById("school-search-response");
                    const items = document.querySelectorAll(".school-query-result");

                    items.forEach((item, index) => {
                        setTimeout(() => {
                            item.classList.add("hide"); // Add fade-out effect
                            setTimeout(() => item.remove(), 100); // Remove after transition
                        }, index * 50); // Delay each removal slightly
                    });
                }

                async function loadResults(schools) {
                    await delay(330)
                    if (schools.length && schools.length < 1000) {
                        const container = document.getElementById("school-search-response");
                        container.innerHTML = '';
                        schools.forEach((school, index) => {
                            const div = document.createElement("div");
                            div.className = "school-query-result";
                            div.innerHTML = school.name;
                            div.style.opacity = "0"; // Start hidden
                            div.style.transform = "translateY(10px)";
                            div.setAttribute("hx-get", `/09052024P2/search/school/${school.code}`); // Example URL
                            div.setAttribute("hx-trigger", "click");
                            div.setAttribute("hx-swap", "outerHTML");
                            div.setAttribute("hx-target", "body");
                            div.setAttribute("hx-select", "#school-page");
                            div.setAttribute("hx-push-url", `/09052024P2/search/school/${school.code}`);

                            container.appendChild(div);

                            setTimeout(() => {
                                div.style.transition = "opacity 0.3s ease-in-out, transform 0.3s ease-in-out";
                                div.style.opacity = "1";
                                div.style.transform = "translateY(0)";
                            }, index * 30); // Delays each item
                        });
                        // document.getElementById("school-search-response").innerHTML = Schools.map(item => `<div class="school-query-result" hx-get="/search">${item}</div>`).join('');
                    } else if (schools.length && schools.length > 100) {
                        document.getElementById("school-search-response").innerHTML = `<div class="school-query-no-result">Lots of results! Please type more to filter them.</div>`
                    } else {
                        document.getElementById("school-search-response").innerHTML = `<div class="school-query-no-result">No matches! Give it another shot.</div>`;
                    }
                    htmx.process(document.getElementById("school-search-response"));
                }

                async function getSearchResults(inputValue) {
                    let spinner = document.getElementById('spinner');
                    removeSchools()
                    spinner.style.display = 'inline';
                    const schools = await getAndStoreQuery(`/static/09052024P2/schoolCodeName.json`, "schoolCodeNameMapping", inputValue.toUpperCase());
                    console.log("schools", schools)

                    await loadResults(schools)

                    spinner.style.display = 'none';
                }

                async function getSearchByCode(code) {
                    let spinner = document.getElementById('spinner');
                    removeSchools()
                    let schools;
                    spinner.style.display = 'inline';
                    const lsValue = localStorage.getItem("09052024P2_schoolCodeNameMapping")
                    const parsedValue = JSON.parse(lsValue);
                    console.log("eeeeeeeeeeeeeeeeeeeeeeeeeeee", parsedValue)
                    schools = parsedValue[code] ? [{ code, name: parsedValue[code] }] : [];
                    if (schools.length) {
                        await loadResults(schools)
                        spinner.style.display = 'none';
                        return
                    }
                    try {
                        const apiRes = await fetch("/static/09052024P2/schoolCodeName.json");
                        const parsedData = await apiRes.json();
                        localStorage.setItem("09052024P2_schoolCodeNameMapping", JSON.stringify(parsedData))
                        schools = parsedData[code] ? [parsedData[code]] : [];
                    } catch (err) {
                        console.log(err)
                        schools = []
                    }

                    await loadResults(schools)

                    spinner.style.display = 'none';
                }

                async function getAndStoreQuery(url, lsKey, pattern) {
                    const lsValue = localStorage.getItem("09052024P2_" + lsKey)
                    if (lsValue) return findPatternMatchingSchoolName(pattern, JSON.parse(lsValue));
                    try {
                        const apiRes = await fetch(url);
                        const parsedData = await apiRes.json();
                        localStorage.setItem("09052024P2_" + lsKey, JSON.stringify(parsedData))
                        return findPatternMatchingSchoolName(pattern, parsedData);
                    } catch (err) {
                        console.log(err)
                        return []
                    }
                }



                const schoolObserver = new IntersectionObserver((entries, observer) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            fetchData(); // Call API when div is visible
                            observer.disconnect(); // Stop observing after first load
                        }
                    });
                }, { threshold: 0.5 }); // 50% of the div must be visible


                schoolObserver.observe(document.getElementById("school-search-myForm"));

                document.getElementById("schoolNameOrCode").addEventListener("keydown", function (event) {
                    if (event.key === "Enter") {
                        event.preventDefault(); // Stop Enter key from submitting the form
                    }
                });

                let schoolTimeout = null;
                schoolInputField.addEventListener('input', async () => {
                    clearTimeout(schoolTimeout);

                    const inputValue = schoolInputField.value.trim();
                    if (inputValue?.length >= 3) {
                        if (!isNaN(inputValue)) {
                            // let startSearchBtn = document.getElementById('school-search-go');
                            console.log('Roll No:', Number(inputValue), inputValue.length);
                            if (inputValue.length === 4 || inputValue.length === 5) {
                                let code = +inputValue;
                                console.log('Code:', code);
                                if (inputValue.length === 5 && inputValue[0] == 0) {
                                    code = +inputValue.slice(1, 5)
                                }
                                await getSearchByCode(code)
                            } else {
                                // startSearchBtn.style.display = 'none';
                            }

                        } else {
                            // if (inputValue.length === 3 && schoolCodeName.includes(inputValue.toUpperCase())) {
                            //     document.getElementById("school-search-response").innerHTML = `<div class="school-query-no-result">Lots of results! Please type more to filter them.</div>`;
                            // } else if (inputValue.length > 3 && schoolCodeName.includes(inputValue.slice(0, 3).toUpperCase())) {
                            //     const slicedInputVal = inputValue.slice(0, 4).toUpperCase()

                            //     schoolTimeout = setTimeout(() => {
                            //         getSearchResults(inputValue.toUpperCase())
                            //     }, 500);
                            // } else {
                            //     console.log('Name:', inputValue);

                            //     schoolInputValStart = inputValue.slice(0, 3);
                            //     const slicedInputVal = schoolInputValStart.toUpperCase()

                            schoolTimeout = setTimeout(() => {
                                getSearchResults(inputValue.toUpperCase())
                            }, 500);

                            // }
                        }
                        spinner.style.display = 'none';
                    } else {
                        document.getElementById("school-search-response").innerText = "";
                    }

                });
            } catch (e) {
                console.log(e)
            }
        </script>
    </div>
</body>

</html>
