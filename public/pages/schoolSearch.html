<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSE Results</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" type="text/css" href="/static/styles/style.css">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
</head>

<body>
    <div id="school-search-page">
        <style>

        </style>
        <div id="individual-school-route-container">
            <div id="individual-route-title">School Search 🏫</div>
            <div id="school-search-route" hx-get="" hx-swap="outerHTML" hx-target="#school-search-page"
                hx-select="#search-page" hx-push-url="?searchType=student">Student Wise 👤</div>
        </div>
        <div class="school-search-input-container">
            <form id="school-search-myForm">
                <label for="schoolNameOrCode">Search by school Name or Code</label>
                <div class="school-search-input-div-container">
                    <input type="text" id="schoolNameOrCode" name="schoolNameOrCode"
                        placeholder="Enter your school name or code ...">
                    <img id="spinner" class="spinner" src="https://htmx.org/img/bars.svg" />
                    <!-- <img id="school-search-go" hx-get="/hello" hx-trigger="click, keyup[keyCode==13]"
                        hx-swap="outerHTML" hx-select="#index-page" hx-target="#school-search-page"
                        hx-vals='js:{ schoolNameOrCode: document.getElementById("schoolNameOrCode").value }'
                        src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c0c0c0' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 12h12M12 6l6 6-6 6'/></svg>"
                        alt="Right Arrow"> -->


                </div>
            </form>
            <div id="school-search-response">

            </div>
        </div>

        <script>
            try {
                function getMainRouteOfUrl() {
                    const urlPath = window.location.pathname;
                    const firstPart = urlPath.split('/')[1];
                    return firstPart;
                }

                const mainRoute = getMainRouteOfUrl();

                const schoolSearchRoute = document.getElementById("school-search-route");
                schoolSearchRoute.setAttribute("hx-get", `/static/pages/search.html`);

                const schoolInputField = document.getElementById('schoolNameOrCode');

                let schoolInputValStart;
                let schoolCodeName;

                function loadScript(src, callback) {
                    // Check if script is already in the document
                    if (document.querySelector(`script[src="${src}"]`)) {
                        console.log(`Script ${src} already loaded.`);
                        if (callback) callback(); // still call the callback to continue flow
                        return;
                    }

                    const script = document.createElement('script');
                    script.src = src;
                    script.onload = callback;
                    script.onerror = function () {
                        console.error(`Failed to load script: ${src}`);
                    };
                    document.head.appendChild(script);
                }
                loadScript('/static/js/main.js', function () {
                    console.log('main.js loaded');
                });
                async function fetchData() {
                    try {
                        let schoolCodeNameMapping;
                        try {
                            schoolCodeNameMapping = await getData("schoolCodeNameMapping", "main");
                        } catch (e) {
                            console.log("Error retrieving data from IndexedDB:", e);
                            schoolCodeNameMapping = null;
                        }
                        if (schoolCodeNameMapping) {
                            schoolCodeName = schoolCodeNameMapping;
                        } else {
                            const schoolNamesApi = await fetch(`/static/data/schoolCodeName.json`);
                            schoolCodeName = await schoolNamesApi.json()
                            await storeData("schoolCodeNameMapping", "main", schoolCodeName)
                        }
                    } catch (error) {
                        console.error("Error fetching data:", error);
                    }
                }

                function findPatternMatchingSchoolName(pattern, schools) {
                    const filteredSchools = []
                    for (const code in schools) {
                        if (schools[code]?.toUpperCase()?.includes(pattern)) {
                            filteredSchools.push({
                                name: schools[code],
                                code
                            })
                        }
                    }
                    return filteredSchools;
                }
                function delay(ms) {
                    return new Promise(resolve => setTimeout(resolve, ms));
                }

                function removeSchools() {
                    const container = document.getElementById("school-search-response");
                    const items = document.querySelectorAll(".school-query-result");

                    items.forEach((item, index) => {
                        setTimeout(() => {
                            item.classList.add("hide"); // Add fade-out effect
                            setTimeout(() => item.remove(), 100); // Remove after transition
                        }, index * 50); // Delay each removal slightly
                    });
                }

                async function loadResults(schools) {
                    await delay(330)
                    if (schools.length && schools.length < 1000) {
                        const container = document.getElementById("school-search-response");
                        container.innerHTML = '';
                        schools.forEach((school, index) => {
                            const div = document.createElement("div");
                            div.className = "school-query-result";
                            div.innerHTML = school.name;
                            div.style.opacity = "0"; // Start hidden
                            div.style.transform = "translateY(10px)";
                            div.setAttribute("hx-get", `/${mainRoute}/search/school/${school.code}`); // Example URL
                            div.setAttribute("hx-trigger", "click");
                            div.setAttribute("hx-swap", "outerHTML");
                            div.setAttribute("hx-target", "body");
                            div.setAttribute("hx-select", "#school-page");
                            div.setAttribute("hx-push-url", `/${mainRoute}/search/school/${school.code}`);

                            container.appendChild(div);

                            setTimeout(() => {
                                div.style.transition = "opacity 0.3s ease-in-out, transform 0.3s ease-in-out";
                                div.style.opacity = "1";
                                div.style.transform = "translateY(0)";
                            }, index * 30); // Delays each item
                        });
                    } else if (schools.length && schools.length > 100) {
                        document.getElementById("school-search-response").innerHTML = `<div class="school-query-no-result">Lots of results! Please type more to filter them.</div>`
                    } else {
                        document.getElementById("school-search-response").innerHTML = `<div class="school-query-no-result">No matches! Give it another shot.</div>`;
                    }
                    htmx.process(document.getElementById("school-search-response"));
                }

                async function getSearchResults(inputValue) {
                    let spinner = document.getElementById('spinner');
                    removeSchools()
                    spinner.style.display = 'inline';
                    const schools = await getAndStoreQuery(`/static/data/schoolCodeName.json`, "schoolCodeNameMapping", inputValue.toUpperCase());
                    console.log("schools", schools)

                    await loadResults(schools)

                    spinner.style.display = 'none';
                }

                async function getSearchByCode(code) {
                    let spinner = document.getElementById('spinner');
                    removeSchools()
                    let schools;
                    spinner.style.display = 'inline';
                    let lsValue;
                    try {
                        lsValue = await getData("schoolCodeNameMapping", "main");
                    } catch (e) {
                        console.log("Error retrieving data from IndexedDB:", e);
                        lsValue = null;
                    }
                    const parsedValue = lsValue;
                    schools = parsedValue[code] ? [{ code, name: parsedValue[code] }] : [];
                    if (schools.length) {
                        await loadResults(schools)
                        spinner.style.display = 'none';
                        return
                    }
                    try {
                        const apiRes = await fetch(`/static/data/schoolCodeName.json`);
                        const parsedData = await apiRes.json();
                        await storeData("schoolCodeNameMapping", "main", parsedData)
                        schools = parsedData[code] ? [parsedData[code]] : [];
                    } catch (err) {
                        console.log(err)
                        schools = []
                    }

                    await loadResults(schools)

                    spinner.style.display = 'none';
                }

                async function getAndStoreQuery(url, lsKey, pattern) {
                    let lsValue;
                    try {
                        lsValue = await getData(mainRoute + "_" + lsKey, "main");
                    } catch (e) {
                        console.log("Error retrieving data from IndexedDB:", e);
                        lsValue = null;
                    }
                    if (lsValue) return findPatternMatchingSchoolName(pattern, lsValue);
                    try {
                        const apiRes = await fetch(url);
                        const parsedData = await apiRes.json();
                        await storeData(mainRoute + "_" + lsKey, "main", parsedData)
                        return findPatternMatchingSchoolName(pattern, parsedData);
                    } catch (err) {
                        console.log(err)
                        return []
                    }
                }



                const schoolObserver = new IntersectionObserver((entries, observer) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            setTimeout(() => {
                                fetchData();
                            }, 500)

                            // Call API when div is visible
                            observer.disconnect(); // Stop observing after first load
                        }
                    });
                }, { threshold: 0.5 }); // 50% of the div must be visible


                schoolObserver.observe(document.getElementById("school-search-myForm"));

                document.getElementById("schoolNameOrCode").addEventListener("keydown", function (event) {
                    if (event.key === "Enter") {
                        event.preventDefault(); // Stop Enter key from submitting the form
                    }
                });

                let schoolTimeout = null;
                schoolInputField.addEventListener('input', async () => {
                    clearTimeout(schoolTimeout);

                    const inputValue = schoolInputField.value.trim();
                    if (inputValue?.length >= 3) {
                        if (!isNaN(inputValue)) {
                            // let startSearchBtn = document.getElementById('school-search-go');
                            console.log('Roll No:', Number(inputValue), inputValue.length);
                            if (inputValue.length === 4 || inputValue.length === 5) {
                                let code = +inputValue;
                                console.log('Code:', code);
                                if (inputValue.length === 5 && inputValue[0] == 0) {
                                    code = +inputValue.slice(1, 5)
                                }
                                await getSearchByCode(code)
                            }

                        } else {
                            schoolTimeout = setTimeout(() => {
                                getSearchResults(inputValue.toUpperCase())
                            }, 500);
                        }
                        spinner.style.display = 'none';
                    } else {
                        document.getElementById("school-search-response").innerText = "";
                    }

                });
                document.body.addEventListener("htmx:afterSwap", function (evt) {
                    if (evt.target.id === "school-search-page") {
                        const currentURL = window.location.pathname;
                        console.log("currentURL", currentURL)
                        if (currentURL.includes("/search")) {

                            const newURL = currentURL.split("/search")[0] + "/search?searchType=school";
                            window.history.pushState({}, "", newURL);
                            // adjustZoom(true);
                        }
                    }
                });
            } catch (e) {
                console.log(e)
            }
        </script>
    </div>
</body>

</html>
