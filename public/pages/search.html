<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSE Results</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" type="text/css" href="/static/styles/style.css">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
</head>

<body>
    <div id="search-page">
        <div id="individual-school-route-container">
            <div id="individual-route-title">Student Search 👤</div>
            <div id="school-search-route" hx-get="" hx-swap="outerHTML" hx-target="#search-page"
                hx-select="#school-search-page" hx-push-url="?searchType=school">School Wise 🏫
            </div>
        </div>
        <div class="input-container">
            <form id="myForm">
                <label for="nameOrRollNo">Search by Name or RollNo</label>
                <div class="input-div-container">
                    <input type="text" id="nameOrRollNo" name="nameOrRollNo" hx-get="/hello"
                        hx-target="#search-response" hx-swap="innerHTML"
                        hx-trigger="keyup[keyCode==13 && this.value.length === 8 && !isNaN(this.value)]"
                        placeholder="Enter your name or roll number">
                    <img id="spinner" class="spinner" src="https://htmx.org/img/bars.svg" />
                    <!-- <img id="search-go" hx-get="/hello" hx-trigger="click, keyup[keyCode==13]" hx-swap="outerHTML"
                        hx-select="#index-page" hx-target="#search-page"
                        hx-vals='js:{ nameOrRollNo: document.getElementById("nameOrRollNo").value }'
                        src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c0c0c0' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 12h12M12 6l6 6-6 6'/></svg>"
                        alt="Right Arrow"> -->


                </div>
            </form>
            <div id="search-response">

            </div>
        </div>

        <script>
            try {

                function getMainRouteOfUrl() {
                    const urlPath = window.location.pathname;
                    const firstPart = urlPath.split('/')[1];
                    return firstPart;
                }

                const mainRoute = getMainRouteOfUrl();

                const schoolSearchRoute = document.getElementById("school-search-route");
                schoolSearchRoute.setAttribute("hx-get", `/static/pages/schoolSearch.html`);
                // if (inputField) {
                const inputField = document.getElementById('nameOrRollNo');

                let inputValStart;
                let largeFileNames;
                let rollnoFiles;

                function loadScript(src, callback) {
                    // Check if script is already in the document
                    if (document.querySelector(`script[src="${src}"]`)) {
                        console.log(`Script ${src} already loaded.`);
                        if (callback) callback(); // still call the callback to continue flow
                        return;
                    }

                    const script = document.createElement('script');
                    script.src = src;
                    script.onload = callback;
                    script.onerror = function () {
                        console.error(`Failed to load script: ${src}`);
                    };
                    document.head.appendChild(script);
                }
                loadScript('/static/js/main.js', function () {


                    async function fetchLargeFileNames() {
                        try {
                            largeFileNamesLS = await getData(`${mainRoute}_largeFileNames`, "main");
                        } catch (e) {
                            console.log("Error retrieving data from IndexedDB:", e);
                            largeFileNamesLS = null;
                        }
                        if (largeFileNamesLS) {
                            largeFileNames = largeFileNamesLS;
                        } else {
                            const largeFileNamesApi = await fetch(`/static/${mainRoute}/largeFileNames.json`);
                            largeFileNames = await largeFileNamesApi.json();
                            await storeData(`${mainRoute}_largeFileNames`, "main", largeFileNames)
                        }
                    }

                    async function fetchRollnoFiles() {
                        if (rollnoFiles) return rollnoFiles;
                        try {
                            rollnoFilesLS = await getData(`${mainRoute}_rollnoFiles`, "main");
                        } catch (e) {
                            console.log("Error retrieving data from IndexedDB:", e);
                            rollnoFilesLS = null;
                        }
                        if (rollnoFilesLS) {
                            rollnoFiles = rollnoFilesLS;
                        } else {
                            const rollnoFilesApi = await fetch(`/static/${mainRoute}/rollno_files.json`);
                            rollnoFiles = await rollnoFilesApi.json();
                            await storeData(`${mainRoute}_rollnoFiles`, "main", rollnoFiles)
                        }
                        return rollnoFiles;
                    }


                    function findPatternMatchingUserName(pattern, users) {
                        return users.filter(str => str.split("(")?.[0]?.includes(pattern))
                    }
                    function findPatternMatchingUserRollno(pattern, users) {
                        return users.filter(str => str.split("(")?.[1]?.split(")")[0]?.startsWith(pattern))
                    }
                    function delay(ms) {
                        return new Promise(resolve => setTimeout(resolve, ms));
                    }

                    function removeUsers() {
                        const container = document.getElementById("search-response");
                        const items = document.querySelectorAll(".user-query-result");

                        items.forEach((item, index) => {
                            setTimeout(() => {
                                item.classList.add("hide");
                                setTimeout(() => item.remove(), 100);
                            }, index * 50);
                        });
                    }

                    async function findRollNoFileName(rollno) {
                        const rollnoFiles = await fetchRollnoFiles();
                        if (rollnoFiles) {
                            if (rollno.length < 8) {
                                rollno = rollno.padEnd(8, '0');
                            }
                            console.log("rollnoFiles", rollno)
                            const rollnoFileIndex = rollnoFiles.findIndex(file => +file > +rollno);
                            if (rollnoFileIndex === -1) {
                                return rollnoFiles[rollnoFiles.length - 1];
                            } else if (rollnoFileIndex === 0) {
                                return rollnoFiles[0];
                            } else {
                                return rollnoFiles[rollnoFileIndex - 1];
                            }
                        } else {
                            console.log("rollnoFiles is empty or undefined");
                            return null;
                        }
                    }

                    async function getSearchResults(inputValue, slicedInputVal, isRollno = false) {
                        let spinner = document.getElementById('spinner');
                        removeUsers()
                        spinner.style.display = 'inline';
                        let users = [];
                        if (isRollno) {
                            const rollnoFileName = await findRollNoFileName(inputValue);
                            console.log("rollnoFileName @@@@@@", rollnoFileName)
                            if (!rollnoFileName) {
                                document.getElementById("search-response").innerHTML = `<div class="user-query-no-result">No matches! Give it another shot.</div>`;
                                spinner.style.display = 'none';
                                return;
                            }
                            users = await getAndStoreQuery(`/static/${mainRoute}/rollno-search/${rollnoFileName}.json`, rollnoFileName, inputValue, true);
                        } else {
                            users = await getAndStoreQuery(`/static/${mainRoute}/user-search/_${slicedInputVal}.json`, slicedInputVal, inputValue.toUpperCase());
                        }

                        await delay(330)
                        if (users.length && users.length < 1000) {
                            const container = document.getElementById("search-response");
                            container.innerHTML = '';
                            users.forEach((user, index) => {
                                const div = document.createElement("div");
                                div.className = "user-query-result";
                                div.innerHTML = user;
                                const rollno = user.split("(")[1].split(")")[0]
                                div.style.opacity = "0";
                                div.style.transform = "translateY(10px)";

                                div.setAttribute("hx-get", `/${mainRoute}/search/student/${rollno}`);
                                div.setAttribute("hx-trigger", "click");
                                div.setAttribute("hx-swap", "outerHTML");
                                div.setAttribute("hx-target", "#search-page");
                                div.setAttribute("hx-select", "#students-page");
                                div.setAttribute("hx-push-url", `/${mainRoute}/search/student/${rollno}`);

                                container.appendChild(div);

                                setTimeout(() => {
                                    div.style.transition = "opacity 0.3s ease-in-out, transform 0.3s ease-in-out";
                                    div.style.opacity = "1";
                                    div.style.transform = "translateY(0)";
                                }, index * 30);
                            });
                        } else if (users.length && users.length > 100) {
                            document.getElementById("search-response").innerHTML = `<div class="user-query-no-result">Lots of results! Please type more to filter them.</div>`
                        } else {
                            document.getElementById("search-response").innerHTML = `<div class="user-query-no-result">No matches! Give it another shot.</div>`;
                        }
                        htmx.process(document.getElementById("search-response"));

                        spinner.style.display = 'none';
                    }

                    async function getAndStoreQuery(url, lsKey, pattern, isRollno = false) {
                        let lsValue;
                        try {
                            lsValue = await getData(`${mainRoute}_rollno_file_` + lsKey, "main");
                        } catch (e) {
                            console.log("Error retrieving data from IndexedDB:", e);
                            lsValue = null;
                        }
                        if (lsValue) return isRollno ? findPatternMatchingUserRollno(pattern, lsValue) : findPatternMatchingUserName(pattern, lsValue);
                        try {
                            const apiRes = await fetch(url);
                            const parsedData = await apiRes.json();
                            await storeData(`${mainRoute}_rollno_file_` + lsKey, "main", parsedData);
                            return isRollno ? findPatternMatchingUserRollno(pattern, parsedData) : findPatternMatchingUserName(pattern, parsedData);
                        } catch (err) {
                            console.log(err)
                            return []
                        }
                    }



                    const observer = new IntersectionObserver((entries, observer) => {
                        entries.forEach(entry => {
                            if (entry.isIntersecting) {
                                setTimeout(() => {
                                    fetchLargeFileNames();
                                    fetchRollnoFiles();
                                    observer.disconnect();
                                }, 500)
                            }
                        });
                    }, { threshold: 0.5 });

                    observer.observe(document.getElementById("myForm"));

                    document.getElementById("nameOrRollNo").addEventListener("keydown", function (event) {
                        if (event.key === "Enter") {
                            event.preventDefault();
                        }
                    });

                    let timeout = null;
                    inputField.addEventListener('input', async () => {
                        clearTimeout(timeout);

                        const inputValue = inputField.value.trim();
                        if (inputValue?.length >= 3) {
                            if (!isNaN(inputValue)) {
                                if (!inputValue.startsWith("2") || inputValue.length > 8) {
                                    document.getElementById("search-response").innerHTML = `<div class="user-query-no-result">Please enter a valid roll number.</div>`;
                                } else if (inputValue.length > 4) {
                                    timeout = setTimeout(() => {
                                        getSearchResults(inputValue, inputValue, true)
                                    }, 500);
                                }
                            } else {
                                if (inputValue.length === 3 && largeFileNames.includes(inputValue.toUpperCase())) {
                                    document.getElementById("search-response").innerHTML = `<div class="user-query-no-result">Lots of results! Please type more to filter them.</div>`;
                                } else if (inputValue.length > 3 && largeFileNames.includes(inputValue.slice(0, 3).toUpperCase())) {
                                    const slicedInputVal = inputValue.slice(0, 4).toUpperCase()

                                    timeout = setTimeout(() => {
                                        getSearchResults(inputValue.toUpperCase(), slicedInputVal)
                                    }, 500);
                                } else {
                                    console.log('Name:', inputValue);

                                    inputValStart = inputValue.slice(0, 3);
                                    const slicedInputVal = inputValStart.toUpperCase()

                                    timeout = setTimeout(() => {
                                        getSearchResults(inputValue.toUpperCase(), slicedInputVal)
                                    }, 500);

                                }
                            }
                            spinner.style.display = 'none';
                        } else {
                            document.getElementById("search-response").innerText = "";
                        }

                    });
                });
                // }
            } catch (e) {
                console.log(e)
            }
            document.body.addEventListener("htmx:afterSwap", function (evt) {
                if (evt.target.id === "search-page") {
                    const currentURL = window.location.pathname;
                    console.log("currentURL", currentURL)
                    if (currentURL.includes("/search")) {

                        const newURL = currentURL.split("/search")[0] + "/search";
                        window.history.pushState({}, "", newURL);
                    }
                }
            });
        </script>
    </div>
</body>

</html>
